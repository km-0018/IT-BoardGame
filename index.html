<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>IT部 ボードゲーム一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      /* ゲーム卓 */
      --felt: #1f4e45;
      --felt-deep: #173c35;
      --felt-line: rgba(255, 255, 255, 0.14);
      --table: #eef0ec;
      --ink: #1c2433;
      --ink-sub: #5b6474;
      --paper: #ffffff;
      --pawn: #f4b942;
      --pawn-ink: #3a2a05;

      --font-display: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
      --font-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", sans-serif;

      --gutter: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--table);
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--pawn);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* =========================
       ゲーム卓（ヘッダーと絞り込み）
    ========================= */
    .table-top {
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.08), transparent 55%),
        var(--felt);
      color: #fff;
      padding: 36px var(--gutter) 32px;
    }

    .table-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 24px 48px;
      align-items: start;
    }

    .site-title {
      grid-column: 1 / -1;
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.9rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .site-lead {
      grid-column: 1 / -1;
      margin: -12px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .filters {
      display: grid;
      gap: 20px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .filter-group {
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    .filter-group legend {
      padding: 0;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 人数：サイコロ風 */
    .die {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 0;
      background: #fff;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12);
    }

    .die.wide {
      width: auto;
      padding: 0 12px;
    }

    .die[aria-pressed="true"] {
      background: var(--pawn);
      color: var(--pawn-ink);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
      transform: translateY(1px);
    }

    /* 時間・会話：チップ */
    .chip {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--felt-line);
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .chip[aria-pressed="true"] {
      background: #fff;
      border-color: #fff;
      color: var(--ink);
      font-weight: 700;
    }

    .first-game {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px dashed rgba(244, 185, 66, 0.7);
      background: rgba(244, 185, 66, 0.08);
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .first-game strong {
      display: block;
      font-size: 1rem;
    }

    .first-game span {
      display: block;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .first-game .check {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--pawn);
      display: grid;
      place-items: center;
    }

    .first-game .check svg {
      opacity: 0;
    }

    .first-game[aria-pressed="true"] {
      border-style: solid;
      background: var(--pawn);
      border-color: var(--pawn);
      color: var(--pawn-ink);
    }

    .first-game[aria-pressed="true"] span {
      color: rgba(58, 42, 5, 0.8);
    }

    .first-game[aria-pressed="true"] .check {
      background: var(--pawn-ink);
      border-color: var(--pawn-ink);
    }

    .first-game[aria-pressed="true"] .check svg {
      opacity: 1;
    }

    /* 選び方のめやす */
    .guide {
      background: var(--felt-deep);
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .guide summary {
      font-weight: 700;
      cursor: pointer;
      list-style: none;
    }

    .guide summary::-webkit-details-marker {
      display: none;
    }

    .guide summary::after {
      content: "＋";
      float: right;
    }

    .guide[open] summary::after {
      content: "－";
    }

    .guide ul {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .guide li {
      padding-left: 14px;
      border-left: 3px solid var(--pawn);
      color: rgba(255, 255, 255, 0.88);
    }

    /* =========================
       棚（一覧）
    ========================= */
    .shelf {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px var(--gutter) 64px;
    }

    .shelf-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .result-count {
      margin: 0;
      font-size: 1rem;
      flex: 1 1 auto;
    }

    .result-count b {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.6rem;
      margin-right: 2px;
    }

    .search {
      flex: 1 1 240px;
      max-width: 360px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1.5px solid #cdd2cb;
      background: var(--paper);
    }

    .sort {
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1.5px solid #cdd2cb;
      background: var(--paper);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
      gap: 28px 20px;
    }

    /* 箱 */
    .box {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }

    .lid {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      color: var(--lid-ink);
      background-color: var(--lid);
      background-image: var(--pattern);
      background-size: var(--pattern-size, auto);
      /* 箱の側面 */
      box-shadow:
        0 6px 0 var(--lid-side),
        0 10px 18px rgba(28, 36, 51, 0.18);
      display: flex;
      flex-direction: column;
      padding: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .box:hover .lid,
    .box:focus-visible .lid {
      transform: translateY(-4px);
      box-shadow:
        0 10px 0 var(--lid-side),
        0 16px 24px rgba(28, 36, 51, 0.22);
    }

    .box:focus-visible {
      outline: none;
    }

    .box:focus-visible .lid {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .lid-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lid.has-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.72), transparent 60%);
    }

    .lid > :not(.lid-photo):not(.seal) {
      position: relative;
      z-index: 1;
    }

    .lid-name {
      margin: auto 0 10px;
      flex: 0 1 auto;
      min-height: 0;
      font-family: var(--font-display);
      font-weight: 400;
      line-height: 1.25;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lid.has-photo .lid-name {
      margin: auto 0 10px;
      color: #fff;
    }

    .lid-name.size-l { font-size: 1.75rem; }
    .lid-name.size-m { font-size: 1.35rem; }
    .lid-name.size-s { font-size: 1.05rem; }
    .lid-name.size-xs { font-size: 0.9rem; }

    .lid-spec {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      padding-top: 8px;
      border-top: 1.5px solid currentColor;
    }

    .lid.has-photo .lid-spec {
      color: #fff;
    }

    .lid-spec span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .lid-spec svg {
      width: 15px;
      height: 15px;
      flex: none;
    }

    /* 会話シール */
    .seal {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      align-content: center;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
      line-height: 1;
      text-align: center;
    }

    .seal b {
      font-size: 1.2rem;
    }

    .seal small {
      font-size: 0.6rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .lid-top {
      min-height: 52px;
      padding-right: 60px;
    }

    .first-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--pawn);
      color: var(--pawn-ink);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .box-genre {
      margin: 16px 2px 0;
      font-size: 0.85rem;
      color: var(--ink-sub);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .state {
      grid-column: 1 / -1;
      padding: 48px 16px;
      text-align: center;
      color: var(--ink-sub);
    }

    .state p {
      margin: 0 0 16px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 20px;
      border-radius: 10px;
      border: 0;
      background: var(--felt);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    /* =========================
       詳細ダイアログ
    ========================= */
    .detail {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      padding: 0;
      border: 0;
      border-radius: 14px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .detail::backdrop {
      background: rgba(23, 60, 53, 0.65);
    }

    .detail[open] {
      animation: lid-open 0.22s ease-out;
    }

    @keyframes lid-open {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .detail-head {
      position: relative;
      padding: 28px 64px 22px 24px;
      color: var(--lid-ink);
      background-color: var(--lid);
      background-image: var(--pattern);
      background-size: var(--pattern-size, auto);
    }

    .detail-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.6rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .detail-head .first-tag {
      margin-top: 10px;
    }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 0;
      background: #fff;
      color: var(--ink);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }

    .detail-body {
      padding: 20px 24px 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 0 0 20px;
    }

    .stats div {
      background: var(--table);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .stats dt {
      font-size: 0.75rem;
      color: var(--ink-sub);
    }

    .stats dd {
      margin: 2px 0 0;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
    }

    .tags li {
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid #cdd2cb;
      font-size: 0.8rem;
      color: var(--ink-sub);
    }

    .detail-summary {
      margin: 0 0 16px;
      white-space: pre-line;
      line-height: 1.8;
    }

    .talk-note {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f7f3e6;
      font-size: 0.88rem;
    }

    .rule-note {
      margin: 12px 0 0;
      font-size: 0.82rem;
      color: var(--ink-sub);
    }

    /* =========================
       スマホ
    ========================= */
    @media (max-width: 860px) {
      .table-inner {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 480px) {
      .table-top {
        padding-top: 28px;
        padding-bottom: 24px;
      }

      .table-inner {
        gap: 18px;
      }

      .site-lead {
        margin-top: -8px;
        font-size: 0.88rem;
      }

      .filters {
        gap: 14px;
      }

      .filter-group legend {
        margin-bottom: 6px;
        font-size: 0.88rem;
      }

      .options {
        gap: 5px;
      }

      .die {
        width: 32px;
        height: 38px;
        border-radius: 8px;
        font-size: 0.95rem;
      }

      .die.wide {
        padding: 0 6px;
      }

      .chip {
        min-height: 36px;
        padding: 4px 11px;
        font-size: 0.84rem;
      }

      .first-game {
        padding: 12px 14px;
      }

      .first-tag {
        white-space: nowrap;
        font-size: 0.62rem;
        padding: 2px 6px;
      }

      .sort {
        flex: 1 1 auto;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 14px;
      }

      .lid {
        padding: 10px;
      }

      .lid-top {
        min-height: 44px;
        padding-right: 46px;
      }

      .seal {
        width: 42px;
        height: 42px;
        top: 8px;
        right: 8px;
      }

      .seal b { font-size: 1rem; }
      .seal small { font-size: 0.52rem; }

      .lid-name.size-l { font-size: 1.35rem; }
      .lid-name.size-m { font-size: 1.05rem; }
      .lid-name.size-s { font-size: 0.85rem; }
      .lid-name.size-xs { font-size: 0.74rem; }

      .lid-spec {
        font-size: 0.72rem;
        gap: 2px 8px;
      }

      .search {
        max-width: none;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- アイコン -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-people" viewBox="0 0 24 24">
      <circle cx="9" cy="7" r="3.5" fill="currentColor" />
      <path d="M2 20c0-3.9 3.1-7 7-7s7 3.1 7 7z" fill="currentColor" />
      <circle cx="17" cy="8" r="2.8" fill="currentColor" opacity=".7" />
      <path d="M17.5 12.5c2.6.3 4.5 2.5 4.5 5.2V20h-4.5c0-2.8-1-5.3-2.7-7.1.8-.3 1.7-.4 2.7-.4z" fill="currentColor" opacity=".7" />
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.6" />
      <path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
    </symbol>
  </svg>

  <header class="table-top">
    <div class="table-inner">
      <h1 class="site-title">IT部 ボードゲーム一覧</h1>
      <p class="site-lead">人数と時間を選ぶと、今日遊べるゲームに絞り込めます。</p>

      <div class="filters">
        <fieldset class="filter-group">
          <legend>何人で遊ぶ？</legend>
          <div class="options" id="players"></div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>時間</legend>
          <div class="options" id="time"></div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>会話</legend>
          <div class="options" id="talk"></div>
        </fieldset>

        <button type="button" class="first-game" id="first-game" aria-pressed="false">
          <span class="check" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span>
          <span>
            <strong>最初の1ゲーム（〜13:20）から選ぶ</strong>
            <span>会話がよく生まれて、30分以内で終わるゲームだけを表示します</span>
          </span>
        </button>
      </div>

      <details class="guide" id="guide">
        <summary>ゲームの選び方</summary>
        <ul>
          <li>最初のゲーム（〜13:20）は、アイスブレイクも兼ねて会話が生まれるもの（会話◎）を選ぶ。お題で話す、相談しながら推理する、当てっこをする、など</li>
          <li>黙って考える時間が長い重いゲーム（会話△）は、2回目以降か、やりたい人がいるときに</li>
          <li>1ゲームの目安は15〜30分。13:20の入れ替えに間に合うようにする</li>
          <li>ルール説明は、遊んだことのある人がする。いなければ運営が説明書を見ながら説明する</li>
        </ul>
      </details>
    </div>
  </header>

  <main class="shelf">
    <div class="shelf-bar">
      <p class="result-count" id="count" aria-live="polite"></p>
      <label class="visually-hidden" for="search">ゲーム名・ジャンル・説明で検索</label>
      <input class="search" type="search" id="search" placeholder="ゲーム名・ジャンル・説明で検索" />
      <label class="visually-hidden" for="sort">並び替え</label>
      <select class="sort" id="sort">
        <option value="">シートの順</option>
        <option value="talk">会話が生まれやすい順</option>
        <option value="time">短い順</option>
        <option value="difficulty">かんたんな順</option>
        <option value="name">名前順</option>
      </select>
    </div>

    <div class="grid" id="list">
      <div class="state">ゲーム一覧を読み込んでいます…</div>
    </div>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detail-title"></dialog>

  <script>
    const SHEET_ID = "1wwxgmxSW5MPJuh823423OUL0Nc9h5wWvvvfIbWWJhds";
    const SHEET_NAME = "IT部ボードゲーム一覧";

    // 会話の生まれやすさ（スプレッドシート L列）
    const TALK = {
      3: { mark: "◎", label: "よく話す", note: "お題で話す、相談しながら推理する、当てっこをするなど、自然に会話が生まれます。最初のゲームにおすすめです。" },
      2: { mark: "〇", label: "話す", note: "会話はありますが、ゲームの操作や駆け引きが中心です。" },
      1: { mark: "△", label: "じっくり", note: "黙って考える時間が長めです。2回目以降か、やりたい人がいるときに遊びましょう。" },
      0: { mark: "?", label: "未設定", note: "会話の生まれやすさはまだ設定されていません。スプレッドシートのL列で設定できます。" }
    };
    const TALK_FROM_SHEET = { "◎": 3, "〇": 2, "○": 2, "△": 1 };

    // 「最初の1ゲーム」の条件
    const FIRST_GAME = { talk: 3, maxTime: 30 };

    // 箱の色：会話の系統ごとに色をそろえる
    const LID_COLORS = {
      3: ["#e2483d", "#ef7a2d", "#e2578c", "#eaa520"],
      2: ["#2e6fd8", "#1a949c", "#3a9659", "#4c5cc2"],
      1: ["#6a4fb3", "#33425f", "#7b3b60", "#3d5c50"],
      0: ["#8d95a1"]
    };

    const PLAYER_OPTIONS = [2, 3, 4, 5, 6, 7, 8, 9, 10];
    const TIME_OPTIONS = [
      { value: null, label: "指定なし" },
      { value: 15, label: "15分以内" },
      { value: 30, label: "30分以内" },
      { value: 60, label: "60分以内" }
    ];
    const TALK_OPTIONS = [
      { value: null, label: "指定なし" },
      { value: "3", label: "◎ よく話す" },
      { value: "2+", label: "〇以上" },
      { value: "1", label: "△ じっくり" }
    ];

    const state = {
      players: null,
      time: null,
      talk: null,
      keyword: "",
      sort: ""
    };

    let games = [];

    // ---------- ユーティリティ ----------

    function toNumber(value) {
      if (value === "" || value === null || value === undefined) return null;
      const n = parseInt(String(value).replace(/[^0-9]/g, ""), 10);
      return Number.isNaN(n) ? null : n;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      return /^https?:\/\//i.test(url) ? url : "";
    }

    function hash(text) {
      let h = 2166136261;
      for (const ch of text) {
        h ^= ch.codePointAt(0);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function shade(hex, amount) {
      const n = parseInt(hex.slice(1), 16);
      const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + amount))));
      const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255);
      return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, "0")}`;
    }

    function inkFor(hex) {
      const n = parseInt(hex.slice(1), 16);
      const lin = c => {
        c /= 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      };
      const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
      // 白文字とのコントラストが足りなければ濃い文字にする
      return (1.05 / (L + 0.05)) >= 3 ? "#ffffff" : "#1c2433";
    }

    // 箱のフタの柄（ゲーム名から決める）
    function lidStyle(game) {
      const h = hash(game.name);
      const colors = LID_COLORS[game.talk];
      const color = colors[h % colors.length];
      const ink = inkFor(color);
      const mark = ink === "#ffffff" ? "rgba(255,255,255,0.13)" : "rgba(28,36,51,0.1)";
      const patterns = [
        [`radial-gradient(${mark} 22%, transparent 24%)`, "22px 22px"],
        [`repeating-linear-gradient(135deg, ${mark} 0 10px, transparent 10px 22px)`, "auto"],
        [`repeating-radial-gradient(circle at 100% 100%, ${mark} 0 8px, transparent 8px 20px)`, "auto"],
        [`linear-gradient(90deg, ${mark} 50%, transparent 50%), linear-gradient(${mark} 50%, transparent 50%)`, "28px 28px"],
        [`repeating-linear-gradient(0deg, ${mark} 0 3px, transparent 3px 14px)`, "auto"]
      ];
      const [pattern, size] = patterns[(h >>> 8) % patterns.length];
      return [
        `--lid:${color}`,
        `--lid-ink:${ink}`,
        `--lid-side:${shade(color, -0.32)}`,
        `--pattern:${pattern}`,
        `--pattern-size:${size}`
      ].join(";");
    }

    function nameSize(name) {
      const len = [...name].length;
      if (len <= 7) return "size-l";
      if (len <= 12) return "size-m";
      if (len <= 20) return "size-s";
      return "size-xs";
    }

    function range(min, max, unit) {
      if (min === null && max === null) return "－";
      if (min !== null && max !== null && min === max) return `${min}${unit}`;
      return `${min ?? ""}〜${max ?? ""}${unit}`;
    }

    function playTime(game) {
      return game.max_time ?? game.min_time;
    }

    function isFirstGame(game) {
      const t = playTime(game);
      return game.talk === FIRST_GAME.talk && t !== null && t <= FIRST_GAME.maxTime;
    }

    function stars(difficulty) {
      return (String(difficulty).match(/★/g) || []).length;
    }

    // ---------- 絞り込みボタン ----------

    function renderOptions() {
      const players = document.getElementById("players");
      players.innerHTML = PLAYER_OPTIONS.map(n => `
        <button type="button" class="die${n >= 10 ? " wide" : ""}" data-value="${n}"
          aria-pressed="${state.players === n}" aria-label="${n}人">${n}</button>
      `).join("");

      document.getElementById("time").innerHTML = TIME_OPTIONS.map(o => `
        <button type="button" class="chip" data-value="${o.value ?? ""}"
          aria-pressed="${state.time === o.value}">${o.label}</button>
      `).join("");

      document.getElementById("talk").innerHTML = TALK_OPTIONS.map(o => `
        <button type="button" class="chip" data-value="${o.value ?? ""}"
          aria-pressed="${state.talk === o.value}">${o.label}</button>
      `).join("");

      const first = state.talk === String(FIRST_GAME.talk) && state.time === FIRST_GAME.maxTime;
      document.getElementById("first-game").setAttribute("aria-pressed", String(first));
    }

    document.getElementById("players").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const n = Number(btn.dataset.value);
      state.players = state.players === n ? null : n;
      update();
    });

    document.getElementById("time").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.time = btn.dataset.value === "" ? null : Number(btn.dataset.value);
      update();
    });

    document.getElementById("talk").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      state.talk = btn.dataset.value === "" ? null : btn.dataset.value;
      update();
    });

    document.getElementById("first-game").addEventListener("click", e => {
      const on = e.currentTarget.getAttribute("aria-pressed") === "true";
      state.talk = on ? null : String(FIRST_GAME.talk);
      state.time = on ? null : FIRST_GAME.maxTime;
      update();
    });

    document.getElementById("search").addEventListener("input", e => {
      state.keyword = e.target.value.trim().toLowerCase();
      update();
    });

    document.getElementById("sort").addEventListener("change", e => {
      state.sort = e.target.value;
      update();
    });

    function resetFilters() {
      state.players = null;
      state.time = null;
      state.talk = null;
      state.keyword = "";
      document.getElementById("search").value = "";
      update();
    }

    // ---------- 一覧 ----------

    function filterGames() {
      return games.filter(g => {
        if (state.keyword && !g.searchText.includes(state.keyword)) return false;

        if (state.players !== null) {
          if (g.min_players !== null && state.players < g.min_players) return false;
          if (g.max_players !== null && state.players > g.max_players) return false;
        }

        if (state.time !== null) {
          const t = playTime(g);
          if (t === null || t > state.time) return false;
        }

        if (state.talk === "3" && g.talk !== 3) return false;
        if (state.talk === "2+" && g.talk < 2) return false;
        if (state.talk === "1" && g.talk !== 1) return false;

        return true;
      });
    }

    function nullsLast(fn) {
      return (a, b) => {
        const x = fn(a), y = fn(b);
        if (x === null && y === null) return a.order - b.order;
        if (x === null) return 1;
        if (y === null) return -1;
        return x - y || a.order - b.order;
      };
    }

    const SORTERS = {
      talk: nullsLast(g => (g.talk === 0 ? null : -g.talk)),
      time: nullsLast(playTime),
      difficulty: nullsLast(g => (stars(g.difficulty) || null)),
      name: (a, b) => a.name.localeCompare(b.name, "ja")
    };

    function renderBox(game, index) {
      const talk = TALK[game.talk];
      const name = escapeHtml(game.name);
      const image = safeUrl(game.image);

      return `
        <button type="button" class="box" data-index="${index}"
          aria-label="${name}（${range(game.min_players, game.max_players, "人")}、${range(game.min_time, game.max_time, "分")}、会話${talk.mark}）の詳細を見る">
          <div class="lid${image ? " has-photo" : ""}" style="${lidStyle(game)}">
            ${image ? `<img class="lid-photo" src="${escapeHtml(image)}" alt="" loading="lazy">` : ""}
            <span class="seal" aria-hidden="true"><b>${talk.mark}</b><small>${talk.label}</small></span>
            <div class="lid-top">${isFirstGame(game) ? `<span class="first-tag">最初の1ゲーム向け</span>` : ""}</div>
            <h3 class="lid-name ${nameSize(game.name)}">${name}</h3>
            <div class="lid-spec">
              <span><svg aria-hidden="true"><use href="#i-people" /></svg>${range(game.min_players, game.max_players, "人")}</span>
              <span><svg aria-hidden="true"><use href="#i-clock" /></svg>${range(game.min_time, game.max_time, "分")}</span>
            </div>
          </div>
          <p class="box-genre">${escapeHtml(game.genre) || "&nbsp;"}</p>
        </button>
      `;
    }

    function render() {
      let result = filterGames();
      if (SORTERS[state.sort]) result = [...result].sort(SORTERS[state.sort]);

      document.getElementById("count").innerHTML =
        `<b>${result.length}</b>件 <span style="color:var(--ink-sub)">／ 全${games.length}件</span>`;

      const list = document.getElementById("list");

      if (result.length === 0) {
        list.innerHTML = `
          <div class="state">
            <p>条件に合うゲームがありません。人数や時間の条件を外してみてください。</p>
            <button type="button" class="button" id="reset">条件をリセット</button>
          </div>`;
        document.getElementById("reset").addEventListener("click", resetFilters);
        return;
      }

      list.innerHTML = result.map(g => renderBox(g, games.indexOf(g))).join("");
    }

    function update() {
      renderOptions();
      render();
    }

    // ---------- 詳細 ----------

    const dialog = document.getElementById("detail");

    function openDetail(game) {
      const talk = TALK[game.talk];
      const link = safeUrl(game.link);
      const tags = String(game.genre)
        .split(/[、,，]/)
        .map(t => t.trim())
        .filter(Boolean);

      dialog.innerHTML = `
        <div class="detail-head" style="${lidStyle(game)}">
          <h2 id="detail-title">${escapeHtml(game.name)}</h2>
          ${isFirstGame(game) ? `<span class="first-tag">最初の1ゲーム向け</span>` : ""}
          <button type="button" class="close" aria-label="閉じる">×</button>
        </div>
        <div class="detail-body">
          <dl class="stats">
            <div><dt>人数</dt><dd>${range(game.min_players, game.max_players, "人")}</dd></div>
            <div><dt>時間</dt><dd>${range(game.min_time, game.max_time, "分")}</dd></div>
            <div><dt>会話</dt><dd>${talk.mark} ${talk.label}</dd></div>
            <div><dt>難易度</dt><dd>${escapeHtml(game.difficulty) || "－"}</dd></div>
          </dl>
          ${tags.length ? `<ul class="tags">${tags.map(t => `<li>${escapeHtml(t)}</li>`).join("")}</ul>` : ""}
          ${game.summary ? `<p class="detail-summary">${escapeHtml(game.summary)}</p>` : ""}
          <p class="talk-note">${talk.note}</p>
          ${link
            ? `<a class="button" href="${escapeHtml(link)}" target="_blank" rel="noopener">説明書を開く（外部サイト）</a>`
            : `<p class="rule-note">説明書のリンクはまだ登録されていません。</p>`}
          <p class="rule-note">ルール説明は、遊んだことのある人がします。いなければ運営が説明書を見ながら説明します。</p>
        </div>
      `;

      dialog.querySelector(".close").addEventListener("click", () => dialog.close());
      dialog.showModal();
    }

    document.getElementById("list").addEventListener("click", e => {
      const box = e.target.closest(".box");
      if (box) openDetail(games[Number(box.dataset.index)]);
    });

    // 背景をクリックしたら閉じる
    dialog.addEventListener("click", e => {
      if (e.target === dialog) dialog.close();
    });

    // ---------- 読み込み ----------

    // 広い画面では選び方を開いておく
    if (window.matchMedia("(min-width: 861px)").matches) {
      document.getElementById("guide").open = true;
    }

    renderOptions();

    // headers=0 で全行をデータとして受け取り、見出し行・空行はここで除外する
    fetch(
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}`
    )
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(text => {
        const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));

        games = json.table.rows
          .map(row => {
            const [
              no, name, genre, summary, difficulty,
              min_players, max_players, min_time, max_time,
              link, image, talk
            ] = row.c.map(c => (c && c.v !== null ? c.v : ""));

            return {
              name: String(name).trim(),
              genre: String(genre).trim(),
              summary: String(summary).trim(),
              difficulty: String(difficulty).trim(),
              min_players: toNumber(min_players),
              max_players: toNumber(max_players),
              min_time: toNumber(min_time),
              max_time: toNumber(max_time),
              link: String(link).trim(),
              image: String(image).trim(),
              talk: TALK_FROM_SHEET[String(talk).trim()] ?? 0
            };
          })
          .filter(g => g.name !== "" && g.name !== "ゲーム名")
          .map((g, i) => ({
            ...g,
            order: i,
            searchText: [g.name, g.genre, g.summary].join(" ").toLowerCase()
          }));

        update();
      })
      .catch(err => {
        console.error(err);
        document.getElementById("list").innerHTML = `
          <div class="state">
            <p>ゲーム一覧を読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。</p>
            <button type="button" class="button" onclick="location.reload()">再読み込み</button>
          </div>`;
      });
  </script>
</body>
</html>
